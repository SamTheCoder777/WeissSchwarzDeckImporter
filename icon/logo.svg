<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="cardClip">
      <rect x="58" y="38" width="140" height="180" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="256" height="256" rx="52" ry="52" fill="#14151a"/>

  <!-- Card body: clean diagonal split, no border, no reticle -->
  <g clip-path="url(#cardClip)">
    <polygon points="58,38 198,38 58,218" fill="#ffffff"/>
    <polygon points="198,38 198,218 58,218" fill="#111214"/>
  </g>

  <!-- Single cyan accent: thin diagonal seam -->
  <line x1="58" y1="38" x2="198" y2="218" stroke="#4fd1c5" stroke-width="4"/>
</svg>
