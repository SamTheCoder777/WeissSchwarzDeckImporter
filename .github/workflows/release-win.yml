name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      APP_NAME: WSDeckImporter
      QT_VERSION: 6.11.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtimageformats'
          cache: true
          aqtversion: '>=3.4.1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg (OpenCV + FAISS)
        uses: lukka/run-vcpkg@v11

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --parallel
        shell: pwsh

      - name: Copy remaining runtime DLLs
        run: |
          $dest = "build/Release"
          # OpenCV + FAISS release DLLs from vcpkg
          $vcpkgBin = "${env:VCPKG_ROOT}/installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin/*.dll" $dest -Force
          } else {
            Write-Warning "vcpkg bin not found at $vcpkgBin"
          }
        shell: pwsh

      - name: Verify deploy
        run: |
          $dest = "build/Release"
          Write-Host "=== Release folder contents ==="
          Get-ChildItem $dest | Select-Object Name
          if (-not (Test-Path "$dest/${{ env.APP_NAME }}.exe")) { Write-Error "exe missing"; exit 1 }
          if (-not (Test-Path "$dest/platforms")) { Write-Warning "platforms/ missing - windeployqt may not have run" }
          if (-not (Test-Path "$dest/onnxruntime.dll")) { Write-Warning "onnxruntime.dll missing" }
        shell: pwsh

      - name: Package
        run: |
          Compress-Archive -Path "build/Release/*" `
            -DestinationPath "${{ env.APP_NAME }}-windows-x64.zip" -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: ${{ env.APP_NAME }}-windows-x64.zip

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_NAME }}-windows-x64.zip